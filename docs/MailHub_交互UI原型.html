function inboxPage(){const a=visible(),count=a.filter(e=>!e.read).length;return title('把重要的邮件，放在一起。','统一管理临时地址与个人邮箱，让每一次收件都清晰可见。','<button data-act="refresh">↻ 刷新列表</button><button class="primary" data-act="new">＋ 创建临时邮箱</button>')+`<div class="metrics"><div class="metric"><div><div class="muted">当前可用邮件</div><div class="value">${a.length}<span class="muted" style="font-size:11px;font-weight:400;margin-left:8px">封</span></div></div><div class="glyph">✉</div></div><div class="metric"><div><div class="muted">待阅读 · 本地状态</div><div class="value">${count}</div></div><div class="glyph">◎</div></div><div class="metric"><div><div class="muted">已连接的个人邮箱</div><div class="value">${S.account.connected?'01':'00'}</div></div><div class="glyph">⊞</div></div></div><div class="workspace ${mobileOpen?'mobile-detail':''}" id="workspace"><section class="inbox-list"><div class="list-tools"><label class="search"><span aria-hidden="true">⌕</span><input id="search" aria-label="搜索主题或发件人" placeholder="搜索主题、发件人…" value="${esc(query)}"></label><div class="filters"><button class="chip ${filter==='all'?'active':''}" data-filter="all">全部来源</button><button class="chip ${filter==='temporary'?'active':''}" data-filter="temporary">临时邮箱</button><button class="chip ${filter==='gmail'?'active':''}" data-filter="gmail">Gmail</button><button class="chip ${unreadOnly?'active':''}" data-act="unread">仅未读</button></div></div><div class="list-caption"><span id="listCount"></span><span>最新优先 · 模拟数据</span></div><div id="mailRows"></div><div class="legend" style="text-align:center">演示数据已全部展示 · 无实际分页</div></section><section class="detail" id="detail"></section></div>`;}
function filtered(){return visible().filter(e=>(filter==='all'||e.source===filter)&&(!unreadOnly||!e.read)&&(!query||(e.subject+' '+e.from+' '+e.address).toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>b.received-a.received);}
function renderList(){const a=filtered();$('#listCount').textContent=a.length+' 封邮件';$('#mailRows').innerHTML=a.length?a.map(e=>`<button class="mail-row ${e.id===selected?'selected':''}" data-email="${esc(e.id)}"><div class="mail-top"><span class="mail-from">${!e.read?'<i class="unread-dot"></i>':''}${esc(e.from)}</span><span class="mail-time">${relative(e.received)}</span></div><div class="mail-subject">${esc(e.subject)}</div><div class="mail-preview">${esc(e.snippet)}</div>${sourceBadge(e.source)} ${e.code?'<span class="badge">验证码</span>':''} ${e.attachment?'<span class="badge">附 1</span>':''}</button>`).join(''):'<div class="empty"><div class="big">⌕</div>没有符合条件的邮件<p>试试其他来源或搜索词。</p></div>';}
function renderDetail(){const e=S.emails.find(x=>x.id===selected&&available(x));if(!e){$('#detail').innerHTML='<div class="empty"><div class="big">✉</div>选择一封邮件开始阅读<p>邮件正文将在这里显示。</p></div>';return;}
$('#detail').innerHTML=`<div class="detail-bar"><div><button class="back small" data-act="back">‹ 返回</button><span class="readonly">邮件详情 / ${e.source==='gmail'?'本地只读镜像':'临时邮箱入站'}</span></div><button class="small ghost" data-act="mark">${e.read?'标为未读':'标为已读'}</button></div><div class="detail-content"><div style="margin-bottom:12px">${sourceBadge(e.source)}</div><h2>${esc(e.subject)}</h2><div class="sender"><div class="sender-avatar">${esc(e.from.slice(0,1))}</div><div class="sender-info"><div>${esc(e.from)} <span class="muted">&lt;${esc(e.address)}&gt;</span></div><div class="muted">收件人：${esc(e.to)}</div><div class="muted">${fmt(e.received)}</div></div></div>${e.code?`<div class="otp-card"><div class="otp-label"><span>✧ 识别到可能的验证码</span><span>演示候选</span></div><div class="otp-code"><div class="code">${showCode?esc(e.code):'••••••'}</div><div class="actions"><button class="small" data-act="reveal">${showCode?'隐藏':'显示'}</button><button class="small primary" data-act="copy-code">复制</button></div></div><div class="muted" style="font-size:11px">不推断实际有效期，请以原邮件内容为准。</div></div>`:''}<div class="tabs"><button class="small ${bodyMode==='text'?'active':''}" data-mode="text">纯文本</button><button class="small ${bodyMode==='html'?'active':''}" data-mode="html">隔离 HTML</button></div><div class="notice">♧ 默认阻止外部图片与跟踪资源。${e.source==='gmail'?'已读标记仅在 MailHub 生效，不修改 Gmail。':'邮箱到期后，邮件与附件将无法继续读取。'}</div><div id="mailBody"></div>${e.attachment?'<div class="attachment"><div>▤ 评审记录_演示.txt<div class="muted" style="font-size:10px">示例文本 · 未做病毒扫描</div></div><button class="small" data-act="download">下载示例</button></div>':''}</div>`;
if(bodyMode==='text')$('#mailBody').innerHTML=`<div class="body-text">${esc(e.body)}</div>`;else{const frame=document.createElement('iframe');frame.title='隔离后的演示邮件正文';frame.setAttribute('sandbox','');frame.referrerPolicy='no-referrer';frame.srcdoc=`<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><style>body{font:14px/1.9 system-ui,sans-serif;padding:20px;color:#293e49}h3{color:#148779;font-size:18px}.text{white-space:pre-wrap}</style></head><body><h3>${esc(e.subject)}</h3><div class="text">${esc(e.body)}</div></body></html>`;$('#mailBody').appendChild(frame);}}
function tempPage(){return title('短暂的地址，完整的掌控。','创建仅属于你的临时邮箱。到期禁读，地址不重复分配。','<button class="primary" data-act="new">＋ 创建临时邮箱</button>')+'<div class="banner">临时邮箱不会提供匿名公开读取链接。过期立即禁读；删除只清理 MailHub 本地数据。</div><div class="cards">'+S.mailboxes.filter(m=>m.status!=='deleted').map(m=>{const active=m.status==='active'&&m.expires>now(),del=m.status==='deleting',ratio=Math.max(0,Math.min(100,(m.expires-now())/(m.expires-m.created)*100));return `<article class="card"><div class="card-head"><div class="pill-icon">◷</div><span class="badge ${active?'teal':del?'warn':'red'}">${active?'接收中':del?'清理中':'已到期'}</span></div><div class="email-address">${esc(m.address)}</div><div class="progress"><span style="width:${ratio}%"></span></div><div class="kv"><span>剩余时间</span><span data-expire="${esc(m.id)}">${active?remaining(m):'不可读取'}</span></div><div class="kv"><span>到期时间</span><span>${fmt(m.expires)}</span></div><div class="kv"><span>关联邮件</span><span>${S.emails.filter(e=>e.mailbox===m.id).length} 封</span></div><div class="actions" style="margin-top:18px"><button class="small" data-act="copy-address" data-id="${esc(m.id)}">复制地址</button><button class="small" data-act="inject" data-id="${esc(m.id)}" ${!active?'disabled':''}>模拟来信</button><button class="small" data-act="renew" data-id="${esc(m.id)}" ${!active||m.expires>=m.created+86400000?'disabled':''}>续期 1 小时</button><button class="small danger" data-act="delete-mailbox" data-id="${esc(m.id)}" ${del?'disabled':''}>删除</button></div></article>`;}).join('')+'<article class="card" style="border-style:dashed;display:grid;place-items:center;min-height:300px"><div style="text-align:center"><div class="pill-icon" style="margin:0 auto 15px">＋</div><h3>为下一次使用创建地址</h3><p class="muted" style="font-size:12px">最多 10 个活跃地址，有效期最长 24 小时。</p><button class="primary" style="margin-top:12px" data-act="new">创建临时邮箱</button></div></article></div>';}
function remaining(m){const s=Math.max(0,Math.floor((m.expires-now())/1000));return Math.floor(s/3600)+'时 '+Math.floor(s%3600/60)+'分 '+String(s%60).padStart(2,'0')+'秒';}
function accountsPage(){const a=S.account,r=a.auth==='reauth_required';return title('连接你的邮箱，不交出控制权。','使用官方授权接入。只读权限，不请求密码，不发送邮件。')+`<div class="banner">Gmail 首次同步仅最近 7 天、最多 200 封 Inbox 邮件；模拟定时同步间隔 5 分钟。原型不会启动真实后台任务。</div><div class="cards"><article class="card"><div class="card-head"><div style="display:flex;gap:13px;align-items:center"><div class="pill-icon" style="background:#edf1ff;color:#5b70bb">G</div><div><h3 style="margin:0">Google Gmail</h3><span class="muted" style="font-size:11px">官方 OAuth · 只读连接</span></div></div><span class="badge ${r?'red':a.connected?'teal':''}">${r?'需要重新授权':a.connected?'已连接':'未连接'}</span></div><div class="email-address">${a.connected?'me.demo@gmail.example.test':'连接你拥有的 Gmail 账号'}</div><div class="kv"><span>上次成功同步</span><span>${a.last?fmt(a.last):'尚未同步'}</span></div><div class="kv"><span>同步范围</span><span>Inbox / 最近 7 天 / 上限 200 封</span></div><div class="kv"><span>Gmail 原邮件</span><span>不会被本地已读或断开操作修改</span></div><div class="notice">gmail.readonly 仍是受限权限。External/Testing 模式的邮件授权刷新令牌有 7 天限制；此处仅模拟授权状态。</div><div class="actions">${a.connected&&!r?'<button class="primary small" data-act="sync">立即同步</button><button class="small" data-act="sync-fail">模拟同步失败</button><button class="small" data-act="reauth">模拟授权失效</button>':'<button class="primary" data-act="connect">'+(r?'重新授权（模拟）':'连接 Gmail（模拟）')+'</button>'}${a.connected?'<button class="small danger" data-act="disconnect">断开连接</button>':''}</div></article><article class="card"><div class="card-head"><div style="display:flex;gap:13px;align-items:center"><div class="pill-icon" style="background:#e8f2fc;color:#487eac">O</div><div><h3 style="margin:0">Microsoft Outlook</h3><span class="muted" style="font-size:11px">Microsoft Graph</span></div></div><span class="badge">后续阶段</span></div><p class="muted">先把 Gmail 的同步与恢复闭环做完整，再接入第二个服务商。</p><div class="notice">此版本没有 Outlook 假连接，不会误导你以为功能已实现。</div><button disabled>暂不开放</button></article></div>`;}
const jobLabels={sync:'Gmail 增量同步',cleanup:'临时邮箱数据清理',disconnect:'断开 Gmail 并清理缓存'};
function tasksPage(){const states={running:['执行中','blue'],succeeded:['已完成','teal'],failed:['失败 · 可重试','red'],cancelled:['已取消','']};return title('每一个后台动作，都有回声。','同步、清理与失败恢复集中展示，避免无声失败。','<button data-act="refresh">↻ 更新状态</button>')+'<div class="card"><div class="card-head"><h2 style="margin:0">任务记录</h2><span class="badge">仅本地演示 · 最多保留 30 条</span></div>'+(!S.jobs.length?'<div class="empty"><div class="big">✓</div>暂时没有后台任务<p>发起同步或删除临时邮箱后，任务会出现在这里。</p></div>':S.jobs.slice().reverse().map(j=>`<div class="task"><div><h3>${jobLabels[j.kind]||'后台任务'}</h3><small>${fmt(j.created)} · 尝试 ${j.attempt} 次 · ${esc(j.id.slice(-8))}</small>${j.error?`<p style="font-size:12px;color:var(--danger)">${esc(j.error)}</p>`:''}<div class="muted" style="font-size:11px">${j.status==='running'?'模拟处理约需 2 秒，关闭页面不会继续真实处理。':j.kind==='disconnect'?'仅清理演示缓存，不影响任何真实 Google 账号。':j.kind==='cleanup'?'关联对象与元数据清理为模拟过程。':'读取结果仅写入本地演示数据。'}</div></div><div class="task-status"><span class="badge ${states[j.status][1]}">${states[j.status][0]}</span>${j.status==='failed'?`<button class="small" data-act="retry" data-id="${esc(j.id)}">重试</button>`:''}</div></div>`).join(''))+'</div>';}
function settingsPage(){const s=S.settings;return title('让工作台，配合你的节奏。','以下设置仅作用于本地演示；生产版本须由服务端验证和执行。')+`<div class="cards"><form class="card" id="settingsForm"><h2>使用偏好</h2><div class="field"><label for="setTTL">默认邮箱有效期<small>到期立即不可读，不能复活。</small></label><select id="setTTL">${[10,30,60,1440].map(x=>`<option value="${x}" ${s.ttl===x?'selected':''}>${x===1440?'24 小时':x+' 分钟'}</option>`).join('')}</select></div><div class="field"><label for="setPoll">列表刷新间隔<small>仅本地读取，不触发 Gmail 同步。</small></label><select id="setPoll">${[15,20,30,60].map(x=>`<option value="${x}" ${s.poll===x?'selected':''}>${x} 秒</option>`).join('')}</select></div><div class="field"><label for="setRetention">Gmail 本地保留期<small>原型只保存偏好，不执行定期清理。</small></label><select id="setRetention">${[7,30,90].map(x=>`<option value="${x}" ${s.retention===x?'selected':''}>${x} 天</option>`).join('')}</select></div><div class="field"><label for="setMask">默认遮挡验证码<small>用户主动显示或复制，不推断有效期。</small></label><input id="setMask" type="checkbox" ${s.mask?'checked':''}></div><div class="field"><label for="setTheme">界面主题<small>调整阅读环境。</small></label><select id="setTheme"><option value="light" ${s.theme==='light'?'selected':''}>浅色 · 默认</option><option value="dark" ${s.theme==='dark'?'selected':''}>深色</option></select></div><button class="primary" style="margin-top:22px" type="submit">保存设置</button></form><div><section class="card"><h2>隐私与原型边界</h2><p class="muted" style="font-size:13px">原型没有网络依赖。邮箱、验证码和邮件内容都是虚构演示，不会触发 OAuth，不会连接 Cloudflare 或读取你的邮箱。</p><div class="notice">localStorage 仅用于保存演示状态，不能照搬为生产邮件或 token 存储方案。剪贴板不可用时会提示手工复制。</div><div class="kv"><span>邮件远程图片</span><span>默认阻止</span></div><div class="kv"><span>附件安全扫描</span><span>未提供</span></div><div class="kv"><span>已读状态</span><span>仅 MailHub 本地</span></div></section><section class="card" style="margin-top:18px"><h3 class="danger">重置演示</h3><p class="muted" style="font-size:12px">移除本地修改并恢复初始模拟内容。不影响任何真实数据。</p><button class="danger" data-act="reset" type="button" style="margin-top:12px">恢复初始演示</button></section></div></div>`;}
function dialog(content){$('#modalBody').innerHTML=content;$('#modal').showModal();}
function close(){ $('#modal').close(); }
function newMailbox(){const active=S.mailboxes.filter(m=>m.status==='active'&&m.expires>now()).length;if(active>=10)return toast('已达 10 个活跃邮箱上限');dialog(`<h2>创建临时邮箱</h2><p class="muted">使用随机地址，只有当前所有者可以查看邮件。</p><form id="newForm"><label for="newTTL" style="margin-top:22px">邮箱有效期</label><select id="newTTL">${[10,30,60,1440].map(x=>`<option value="${x}" ${S.settings.ttl===x?'selected':''}>${x===1440?'24 小时':x+' 分钟'}</option>`).join('')}</select><div class="notice">模拟域名 inbox.example.test 不可接收真实邮件。创建后可使用“模拟来信”体验。</div><div class="actions"><button type="button" data-act="close">取消</button><button class="primary" type="submit">生成地址</button></div></form>`);}
async function copy(text){try{if(!navigator.clipboard)throw Error();await navigator.clipboard.writeText(text);toast('已复制到剪贴板');}catch{dialog('<h2>请手动复制</h2><p class="muted">浏览器限制了当前本地页面的剪贴板访问。</p><textarea readonly style="width:100%;padding:14px;font:inherit" aria-label="待复制内容">'+esc(text)+'</textarea><div class="actions"><button data-act="close">关闭</button></div>');const t=$('#modal textarea');t.focus();t.select();}}
function makeMail(m){return {id:uid('email'),source:'temporary',mailbox:m.id,from:'Demo 验证服务',address:'noreply@demo.example.test',to:m.address,subject:'新的模拟验证码邮件',snippet:'一封新邮件已抵达你的临时地址。',body:'你好，\n\n请使用上方演示验证码完成操作。\n验证码仅用于原型体验，不对应任何真实账号。\n\n请勿将临时邮箱用于重要账号找回。',code:String(Math.floor(100000+Math.random()*900000)),received:now(),read:false,attachment:false};}
function startJob(kind,target,fail=false){if(S.jobs.some(j=>j.kind===kind&&j.target===target&&j.status==='running'))return toast('已有同类任务执行中，请勿重复触发');const j={id:uid('job'),kind,target,status:'running',created:now(),attempt:1,fail,error:''};S.jobs.push(j);S.jobs=S.jobs.slice(-30);save();render();toast(kind==='sync'?'同步任务已创建（模拟）':'清理任务已创建（模拟）');runJob(j);}
function runJob(j){setTimeout(()=>{if(!S.jobs.some(x=>x.id===j.id)||j.status!=='running')return;if(j.fail){j.status='failed';j.error='UPSTREAM_UNAVAILABLE · 模拟上游暂时不可用';}else if(j.kind==='sync'&&(!S.account.connected||S.account.auth==='reauth_required')){j.status='failed';j.error='REAUTH_REQUIRED · 请先重新授权';}else{j.status='succeeded';j.error='';if(j.kind==='sync'){S.account.last=now();S.emails.unshift({id:uid('email'),source:'gmail',from:'Sync Demo',address:'sync@demo.example.test',to:'me.demo@gmail.example.test',subject:'同步完成：这是一封新的模拟邮件',snippet:'远程同步与列表刷新是两个不同的动作。',body:'这封邮件由模拟同步任务生成。\n\n真实版本需要通过 Gmail API 获取数据，并进行增量同步、幂等入库与错误恢复。',received:now(),read:false,attachment:false});}if(j.kind==='cleanup'){S.emails=S.emails.filter(e=>e.mailbox!==j.target);const m=S.mailboxes.find(m=>m.id===j.target);if(m)m.status='deleted';}if(j.kind==='disconnect'){S.emails=S.emails.filter(e=>e.source!=='gmail');S.account.last=null;}}save();render();toast(j.status==='failed'?'任务失败，可在任务中心查看并重试':'任务已完成（模拟）');},1800);}
function sync(fail=false){if(!S.account.connected||S.account.auth==='reauth_required')return toast('请在邮箱连接页先完成模拟授权');startJob('sync','gmail_demo',fail);}
function checkExpiry(){let changed=false;for(const m of S.mailboxes){if(m.status==='active'&&m.expires<=now()){m.status='expired';changed=true;}}if(changed){save();render();}if(page==='temporary')$$('[data-expire]').forEach(x=>{const m=S.mailboxes.find(m=>m.id===x.dataset.expire);if(m&&m.status==='active')x.textContent=remaining(m);});}
document.addEventListener('input',ev=>{if(ev.target.id==='search'){query=ev.target.value;renderList();}});
document.addEventListener('submit',ev=>{if(ev.target.id==='newForm'){ev.preventDefault();const ttl=Number($('#newTTL').value);if(![10,30,60,1440].includes(ttl))return;const t=now(),id=uid('mb'),part=id.replace(/[^a-z0-9]/g,'').slice(-16);S.mailboxes.push({id,address:part+'@inbox.example.test',created:t,expires:t+ttl*60000,status:'active'});save();close();go('temporary');toast('临时邮箱已创建（模拟）');}if(ev.target.id==='settingsForm'){ev.preventDefault();S.settings={ttl:Number($('#setTTL').value),poll:Number($('#setPoll').value),retention:Number($('#setRetention').value),mask:$('#setMask').checked,theme:$('#setTheme').value};showCode=!S.settings.mask;save();render();toast('偏好设置已保存；刷新和保留策略在原型中仅作配置演示');}});
document.addEventListener('click',ev=>{const nav=ev.target.closest('[data-page]');if(nav){go(nav.dataset.page);return;}const f=ev.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return;}const row=ev.target.closest('[data-email]');if(row){selected=row.dataset.email;const e=S.emails.find(x=>x.id===selected);e.read=true;showCode=!S.settings.mask;bodyMode='text';mobileOpen=true;save();render();return;}const mode=ev.target.closest('[data-mode]');if(mode){bodyMode=mode.dataset.mode;renderDetail();return;}const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;const act=b.dataset.act,id=b.dataset.id,e=S.emails.find(x=>x.id===selected),m=S.mailboxes.find(x=>x.id===id);
switch(act){case 'close':close();break;case 'new':newMailbox();break;case 'refresh':render();toast('本地列表已更新；未触发任何远程同步');break;case 'unread':unreadOnly=!unreadOnly;render();break;case 'back':mobileOpen=false;render();break;case 'mark':if(e){e.read=!e.read;save();render();}break;case 'reveal':showCode=!showCode;renderDetail();break;case 'copy-code':if(e?.code)copy(e.code);break;case 'copy-address':if(m)copy(m.address);break;case 'renew':if(m&&m.status==='active'&&m.expires>now()){m.expires=Math.min(m.expires+3600000,m.created+86400000);save();render();toast('有效期已延长，最长为创建后 24 小时');}break;case 'inject':if(m&&m.status==='active'&&m.expires>now()){S.emails.unshift(makeMail(m));save();render();toast('模拟新邮件已送达，可前往收件箱查看');}break;case 'delete-mailbox':if(m)dialog(`<h2>删除这个临时邮箱？</h2><p class="email-address">${esc(m.address)}</p><div class="notice">立即停止读取和接收，随后清理关联模拟邮件。此操作不可撤销，不影响任何真实邮箱。</div><div class="actions"><button data-act="close">取消</button><button class="danger" data-act="confirm-delete" data-id="${esc(id)}">确认删除</button></div>`);break;case 'confirm-delete':if(m){m.status='deleting';close();startJob('cleanup',m.id);}break;case 'sync':sync();break;case 'sync-fail':sync(true);break;case 'reauth':S.account.auth='reauth_required';save();render();toast('已模拟授权失效，自动同步应停止');break;case 'connect':if(S.jobs.some(j=>j.kind==='disconnect'&&j.status==='running')){toast('请等待断开清理任务完成后再连接');break;}dialog('<h2>模拟 Gmail 授权</h2><p>即将连接虚构账号 me.demo@gmail.example.test。</p><div class="notice">仅演示只读授权后的页面状态，不会打开 Google，不获取真实 token，不读取任何真实邮件。</div><div class="actions"><button data-act="close">取消</button><button class="primary" data-act="confirm-connect">完成模拟授权</button></div>');break;case 'confirm-connect':S.account.connected=true;S.account.auth='connected';save();close();render();toast('模拟连接成功，可以发起同步');break;case 'disconnect':dialog('<h2>断开 Gmail 连接？</h2><p>停止同步，并清理 MailHub 中此账号的模拟缓存。</p><div class="notice">不会删除 Gmail 原邮件。真实版本还需撤销远程 token，此原型仅改变本地演示。</div><div class="actions"><button data-act="close">取消</button><button class="danger" data-act="confirm-disconnect">确认断开</button></div>');break;case 'confirm-disconnect':S.account.connected=false;S.account.auth='disconnected';S.jobs.filter(j=>j.kind==='sync'&&j.status==='running').forEach(j=>{j.status='cancelled';});close();startJob('disconnect','gmail_demo');break;case 'retry':{const j=S.jobs.find(x=>x.id===id);if(j&&j.status==='failed'){if(j.kind==='sync'&&(!S.account.connected||S.account.auth==='reauth_required')){toast('请先完成模拟授权，再重试同步');break;}j.fail=false;j.status='running';j.error='';j.attempt++;save();render();runJob(j);}}break;case 'download':{const blob=new Blob(['MailHub 原型附件\n\n这是本地生成的模拟文本。\n真实版本需校验邮件、附件归属和过期状态。\n未提供病毒扫描。'],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='MailHub_评审记录_演示.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('已生成模拟文本附件');}break;case 'reset':dialog('<h2>恢复初始演示？</h2><p class="muted">将移除本地模拟邮箱、任务和设置，恢复原始示例内容。</p><div class="actions"><button data-act="close">取消</button><button class="danger" data-act="confirm-reset">确认重置</button></div>');break;case 'confirm-reset':S=initial();selected='e1';filter='all';query='';unreadOnly=false;showCode=false;save();close();go('inbox');toast('已恢复初始演示');break;}});
S.jobs.filter(j=>j.status==='running').forEach(j=>{j.status='failed';j.error='DEMO_INTERRUPTED · 页面关闭中断了模拟任务，请重试';});
showCode=!S.settings.mask;checkExpiry();render();save();setInterval(checkExpiry,1000);
</script></body></html>
