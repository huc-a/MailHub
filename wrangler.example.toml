name = "mailhub"
main = "src/worker.ts"
compatibility_date = "2026-10-26"
workers_dev = false

[assets]
directory = "./dist/client"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "mailhub-dev"
# Replace this placeholder with the D1 database ID from your Cloudflare account.
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MAIL_OBJECTS"
bucket_name = "mailhub-dev"

[triggers]
crons = ["*/1 * * * *"]

[vars]
APP_ENV = "production"
APP_BASE_URL = "https://mail.example.com"
MAIL_DOMAIN = "mail.example.com"
# Configure these for your Cloudflare Access application before adding a route.
# ACCESS_TEAM_DOMAIN = "your-team.cloudflareaccess.com"
# ACCESS_AUD = "your-access-application-audience"
