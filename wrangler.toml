name = "mailhub"
main = "src/worker.ts"
compatibility_date = "2026-10-26"
workers_dev = false

[assets]
directory = "./dist/client"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "mailhub-dev"
database_id = "d71b8456-203f-4da0-ad0b-5bab7e7fd915"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MAIL_OBJECTS"
bucket_name = "mailhub-dev"

[triggers]
crons = ["*/1 * * * *"]

[vars]
APP_ENV = "production"
MAIL_DOMAIN = "inbox.example.invalid"
